<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITEL%%</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
#map{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1}

/* ── Filter panel ── */
.filter-panel{
  position:absolute;top:14px;left:14px;z-index:1000;
  background:rgba(15,23,42,.92);backdrop-filter:blur(16px);
  border:1px solid rgba(148,163,184,.15);border-radius:14px;
  padding:18px 20px 14px;width:280px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.fp-title{
  font-size:15px;font-weight:700;letter-spacing:-.02em;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.fp-title svg{flex-shrink:0}
.fp-group{margin-bottom:14px}
.fp-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:6px}
.fp-pills{display:flex;gap:4px}
.fp-pill{
  flex:1;text-align:center;padding:7px 0;font-size:12px;font-weight:600;
  border-radius:8px;cursor:pointer;transition:all .15s;
  border:1px solid rgba(148,163,184,.2);background:transparent;color:#94a3b8;
}
.fp-pill:hover{border-color:rgba(148,163,184,.4);color:#cbd5e1}
.fp-pill.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.fp-pill.active.koop{background:#22c55e;border-color:#22c55e}
.fp-pill.active.huur{background:#f97316;border-color:#f97316}

.fp-range-wrap{position:relative}
.fp-range{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;
  background:rgba(148,163,184,.2);border-radius:3px;outline:none;
}
.fp-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#3b82f6;border:2px solid #1e293b;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.fp-range::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#3b82f6;border:2px solid #1e293b;cursor:pointer;
}
.fp-range-val{
  position:absolute;right:0;top:-2px;font-size:13px;font-weight:700;color:#e2e8f0;
  font-variant-numeric:tabular-nums;
}

/* ── Counters ── */
.fp-counts{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(148,163,184,.12);
}
.fp-count{
  background:rgba(148,163,184,.08);border-radius:8px;padding:8px 10px;
  text-align:center;
}
.fp-count-num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.fp-count-label{font-size:10px;color:#94a3b8;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.fp-count.koop .fp-count-num{color:#4ade80}
.fp-count.huur .fp-count-num{color:#fb923c}
.fp-count.fam .fp-count-num{color:#60a5fa}
.fp-count.total .fp-count-num{color:#e2e8f0}

/* ── Export button ── */
.fp-export{
  margin-top:10px;width:100%;padding:10px;font-size:13px;font-weight:600;
  border:1px solid rgba(148,163,184,.2);border-radius:8px;
  background:rgba(148,163,184,.06);color:#e2e8f0;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;
}
.fp-export:hover{background:rgba(59,130,246,.15);border-color:#3b82f6;color:#93c5fd}

/* ── CBS panel ── */
.cbs-panel{
  position:absolute;top:14px;right:14px;z-index:1000;
  background:rgba(15,23,42,.92);backdrop-filter:blur(16px);
  border:1px solid rgba(148,163,184,.15);border-radius:14px;
  padding:16px 18px;width:230px;max-height:calc(100vh - 28px);overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.cbs-panel::-webkit-scrollbar{width:4px}
.cbs-panel::-webkit-scrollbar-track{background:transparent}
.cbs-panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:2px}
.cb-title{font-size:13px;font-weight:700;margin-bottom:4px}
.cb-section{padding:8px 0;border-bottom:1px solid rgba(148,163,184,.1)}
.cb-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:4px}
.cb-grid{display:flex;justify-content:space-between;font-size:13px}
.cb-dim{color:#64748b;font-size:12px}
.cb-bar-wrap{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px;color:#94a3b8}
.cb-bar{height:5px;border-radius:3px;min-width:2px;flex-shrink:0}
.cb-split{display:flex;gap:6px;margin-bottom:4px}
.cb-chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
.cb-chip.koop{background:rgba(34,197,94,.15);color:#4ade80}
.cb-chip.huur{background:rgba(249,115,22,.15);color:#fb923c}

/* ── Popup ── */
.leaflet-popup-content-wrapper{
  background:rgba(15,23,42,.95)!important;backdrop-filter:blur(12px);
  border:1px solid rgba(148,163,184,.15)!important;border-radius:12px!important;
  box-shadow:0 8px 32px rgba(0,0,0,.4)!important;color:#e2e8f0!important;
}
.leaflet-popup-tip{background:rgba(15,23,42,.95)!important}
.leaflet-popup-content{font-size:12px;line-height:1.6;min-width:220px;font-family:'DM Sans',system-ui,sans-serif}
.leaflet-popup-content b{color:#f1f5f9}
.leaflet-popup-content hr{border:none;border-top:1px solid rgba(148,163,184,.15);margin:6px 0}
.leaflet-popup-close-button{color:#94a3b8!important}
.pop-eigendom{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:600;font-size:11px}
.pop-eigendom.koop{background:rgba(34,197,94,.2);color:#4ade80}
.pop-eigendom.huur{background:rgba(249,115,22,.2);color:#fb923c}
.pop-eigendom.fam{background:rgba(59,130,246,.2);color:#60a5fa}
.pop-label{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:11px;color:#fff}

.leaflet-control-zoom{border:none!important}
.leaflet-control-zoom a{
  background:rgba(15,23,42,.85)!important;backdrop-filter:blur(8px);
  color:#e2e8f0!important;border:1px solid rgba(148,163,184,.15)!important;
}
.leaflet-control-zoom a:hover{background:rgba(30,41,59,.95)!important}
</style>
</head>
<body>
<div id="map"></div>

<!-- Filter panel -->
<div class="filter-panel">
  <div class="fp-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
    Filters
  </div>

  <div class="fp-group">
    <div class="fp-label">Eigendom</div>
    <div class="fp-pills" id="eigendomPills">
      <div class="fp-pill active" data-val="alle">Alle</div>
      <div class="fp-pill koop" data-val="koop">Koop</div>
      <div class="fp-pill huur" data-val="huur">Huur</div>
    </div>
  </div>

  <div class="fp-group">
    <div class="fp-label">Bouwtype</div>
    <div class="fp-pills" id="bouwtypePills">
      <div class="fp-pill active" data-val="alle">Beide</div>
      <div class="fp-pill" data-val="laagbouw">Laagbouw</div>
      <div class="fp-pill" data-val="hoogbouw">Hoogbouw</div>
    </div>
  </div>

  <div class="fp-group">
    <div class="fp-label">Min. perceel oppervlakte</div>
    <div class="fp-range-wrap">
      <span class="fp-range-val" id="perceelVal">0 m²</span>
      <input type="range" class="fp-range" id="perceelRange" min="0" max="1000" step="25" value="0">
    </div>
  </div>

  <div class="fp-counts">
    <div class="fp-count koop"><div class="fp-count-num" id="cntKoop">0</div><div class="fp-count-label">Koop</div></div>
    <div class="fp-count huur"><div class="fp-count-num" id="cntHuur">0</div><div class="fp-count-label">Huur</div></div>
    <div class="fp-count fam"><div class="fp-count-num" id="cntFam">0</div><div class="fp-count-label">Familie</div></div>
    <div class="fp-count total"><div class="fp-count-num" id="cntTotal">0</div><div class="fp-count-label">Zichtbaar</div></div>
  </div>

  <button class="fp-export" id="btnExport" title="Download gefilterde selectie als CSV">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Exporteer gefilterde selectie
  </button>
</div>

<!-- CBS panel -->
<div class="cbs-panel">
  <div class="cb-title">📊 %%BUURT_DISPLAY%%</div>
  %%KADASTER_LINK%%
  %%CBS_CONTENT%%
</div>

<script>
// ── Data (injected by Python) ──
const allWoningen = %%WONINGEN_JSON%%;
const CONFIG = %%CONFIG_JSON%%;

// ── Map ──
const map = L.map('map', {zoomControl: false}).setView([CONFIG.center_lat, CONFIG.center_lon], 17);
L.control.zoom({position: 'bottomright'}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/">OSM</a>'
}).addTo(map);

// Centrum marker + straal
if (CONFIG.centrum_lat && CONFIG.centrum_lon && CONFIG.straal) {
  L.marker([CONFIG.centrum_lat, CONFIG.centrum_lon], {
    icon: L.divIcon({
      className:'',
      html:'<div style="width:14px;height:14px;background:#ef4444;border:3px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:0 0 12px rgba(239,68,68,.6)"></div>',
      iconSize:[14,14],iconAnchor:[7,7]
    })
  }).addTo(map).bindPopup('<b style="color:#f1f5f9">📍 Centrum</b>');

  L.circle([CONFIG.centrum_lat, CONFIG.centrum_lon], {
    radius: CONFIG.straal, color:'#ef4444', weight:1.5, opacity:.5,
    fillColor:'#ef4444', fillOpacity:.03, dashArray:'6,4'
  }).addTo(map);
}

// ── Markers ──
let markers = [];

const COLORS = {
  KOOP:  { fill:'#22c55e', border:'#15803d' },
  HUUR:  { fill:'#f97316', border:'#c2410c' },
  FAM:   { fill:'#3b82f6', border:'#1d4ed8' },
  '':    { fill:'#eab308', border:'#a16207' }
};

const LABEL_COLORS = {
  'A+++':'#009036','A++':'#009036','A+':'#009036','A':'#009036',
  'B':'#55ab26','C':'#c8d100','D':'#fff200','E':'#f7a600','F':'#ee7203','G':'#e2001a'
};

function svgIcon(isHoog) {
  if (isHoog) return '<svg viewBox="0 0 24 24" width="12" height="12" fill="white"><path d="M17 11V3H7v4H3v14h8v-4h2v4h8V11h-4zM7 19H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm4 4H9v-2h2v2zm0-4H9V9h2v2zm0-4H9V5h2v2zm4 8h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm4 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>';
  return '<svg viewBox="0 0 24 24" width="12" height="12" fill="white"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>';
}

function buildPopup(w) {
  let h = `<b>${w.adres}</b><br>${w.postcode} ${w.plaats}<hr>`;

  let typeStr = w.woningtype || '';
  if (!typeStr && w.woningtype_geschat) typeStr = `~${w.woningtype_geschat} ${w.woningtype_zekerheid}%`;
  if (w.bouwtype) h += `<b>Type:</b> ${w.bouwtype}${typeStr ? ' ('+typeStr+')' : ''}<br>`;
  if (w.bouwjaar) h += `<b>Bouwjaar:</b> ${w.bouwjaar}<br>`;
  if (w.woon_opp_m2) h += `<b>Woning:</b> ${Math.round(w.woon_opp_m2)} m²<br>`;
  if (w.perceel_opp_m2) h += `<b>Perceel:</b> ${Math.round(w.perceel_opp_m2)} m²<br>`;
  if (w.perceel_gedeeld_door > 1) h += `<b>Gedeeld:</b> ${w.perceel_gedeeld_door} woningen<br>`;

  h += '<hr>';

  if (w.eigendom) {
    const cls = w.eigendom === 'KOOP' ? 'koop' : w.eigendom === 'HUUR' ? 'huur' : 'fam';
    const txt = {KOOP:'KOOP',HUUR:'HUUR',FAM:'FAMILIE-ERF'}[w.eigendom] || w.eigendom;
    h += `<span class="pop-eigendom ${cls}">${txt} ${w.eigendom_kans}%</span><br>`;
    h += `<span style="font-size:11px;color:#94a3b8">Koop ${w.kans_koop}% · Huur ${w.kans_huur}%</span><br>`;
    if (w.signalen && w.signalen.length) h += `<span style="font-size:11px;color:#64748b;font-style:italic">${w.signalen.slice(0,3).join(', ')}</span><br>`;
  }

  if (w.energielabel) {
    const lc = LABEL_COLORS[w.energielabel] || '#666';
    h += `<b>Label:</b> <span class="pop-label" style="background:${lc}">${w.energielabel}</span><br>`;
  }

  h += `<span style="font-size:11px;color:#64748b">Afstand: ${Math.round(w.afstand_m)}m</span>`;
  return h;
}

function createMarkers() {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];

  allWoningen.forEach(w => {
    const c = COLORS[w.eigendom] || COLORS[''];
    const isHoog = (w.aantal_in_pand || 1) > 3;
    const icon = L.divIcon({
      className:'',
      html:`<div style="background:${c.fill};border:2px solid ${c.border};border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:opacity .2s">${svgIcon(isHoog)}</div>`,
      iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-10]
    });
    const marker = L.marker([w.lat, w.lon], {icon}).addTo(map).bindPopup(buildPopup(w));
    markers.push({marker, data: w});
  });
}

createMarkers();

// ── Filtering ──
let filterEigendom = 'alle';
let filterBouwtype = 'alle';
let filterMinPerceel = 0;

function passesFilter(w) {
  if (filterEigendom === 'koop' && w.eigendom !== 'KOOP') return false;
  if (filterEigendom === 'huur' && w.eigendom !== 'HUUR') return false;

  const isHoog = (w.aantal_in_pand || 1) > 3;
  if (filterBouwtype === 'laagbouw' && isHoog) return false;
  if (filterBouwtype === 'hoogbouw' && !isHoog) return false;

  if (filterMinPerceel > 0) {
    if ((w.perceel_opp_m2 || 0) < filterMinPerceel) return false;
  }

  return true;
}

function applyFilters() {
  let cntK=0, cntH=0, cntF=0, cntT=0;

  markers.forEach(m => {
    const show = passesFilter(m.data);
    if (show) {
      if (!map.hasLayer(m.marker)) m.marker.addTo(map);
      cntT++;
      if (m.data.eigendom === 'KOOP') cntK++;
      else if (m.data.eigendom === 'HUUR') cntH++;
      else if (m.data.eigendom === 'FAM') cntF++;
    } else {
      map.removeLayer(m.marker);
    }
  });

  document.getElementById('cntKoop').textContent = cntK;
  document.getElementById('cntHuur').textContent = cntH;
  document.getElementById('cntFam').textContent = cntF;
  document.getElementById('cntTotal').textContent = cntT;
}

// Pill buttons
function setupPills(containerId, callback) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.fp-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      container.querySelectorAll('.fp-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      callback(pill.dataset.val);
    });
  });
}

setupPills('eigendomPills', val => { filterEigendom = val; applyFilters(); });
setupPills('bouwtypePills', val => { filterBouwtype = val; applyFilters(); });

// Range slider
const rangeEl = document.getElementById('perceelRange');
const rangeVal = document.getElementById('perceelVal');
rangeEl.addEventListener('input', () => {
  filterMinPerceel = parseInt(rangeEl.value);
  rangeVal.textContent = filterMinPerceel === 0 ? '0 m²' : `≥ ${filterMinPerceel} m²`;
  applyFilters();
});

// Initial count
applyFilters();

// ── CSV Export ──
document.getElementById('btnExport').addEventListener('click', () => {
  const filtered = allWoningen.filter(passesFilter);
  if (!filtered.length) { alert('Geen woningen in huidige selectie'); return; }

  const sep = ';';
  const header = ['nr','straat','huisnr','huisletter','toevoeging','postcode','plaats',
    'lat','lon','afstand_m','bouwtype','woningtype','aantal_in_pand','bouwjaar',
    'woon_opp_m2','perceel_opp_m2','perceelnummer','kadastrale_aanduiding',
    'perceel_gedeeld_door','eigendom','eigendom_kans','kans_koop','kans_huur',
    'gevel_orientatie','energielabel','pand_id'];

  let csv = header.join(sep) + '\n';
  filtered.forEach((w, i) => {
    csv += [
      i+1, w.straat, w.huisnr, w.huisletter, w.toevoeging, w.postcode, w.plaats,
      w.lat, w.lon, Math.round(w.afstand_m), w.bouwtype, w.woningtype||w.woningtype_geschat||'',
      w.aantal_in_pand, w.bouwjaar||'',
      w.woon_opp_m2||'', w.perceel_opp_m2||'', w.perceelnummer||'', w.kadastrale_aanduiding||'',
      w.perceel_gedeeld_door||'', w.eigendom, w.eigendom_kans, w.kans_koop, w.kans_huur,
      w.gevel_orientatie||'', w.energielabel||'', w.pand_id
    ].join(sep) + '\n';
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `buurtdata_${filterEigendom}_${filterBouwtype}_${filtered.length}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
